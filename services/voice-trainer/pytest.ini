[pytest]
# Added 2026-07-30. These tests existed and passed, but NOTHING ran them: there
# was no pytest.ini, no pyproject.toml, and no script, doc or CI file in the repo
# that invoked pytest. The runner existed only as a binary inside .venv, so the
# whole voice-analysis half of the app was outside every automated gate — its
# tests could only go red if someone happened to type the command by hand.
#
# Wired into the repo gate as `npm run test:python`, which `npm test` runs.
testpaths = tests
python_files = test_*.py
addopts = -q
# The DSP tests are the slowest part and still finish in ~20s, so there is no
# reason to keep them out of the default gate.
