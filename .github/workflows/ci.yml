name: TransVoice CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transvoice-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Node coaching
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:backend

  frontend:
    name: Frontend tests + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend

  voice-trainer:
    name: VoiceTrainer Python
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/voice-trainer/requirements.txt
      - run: bash services/voice-trainer/setup-venv.sh
      - run: services/voice-trainer/.venv/bin/pip install pytest httpx
      - run: bash scripts/test-python.sh

  product-laws:
    name: FEM product-law regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test backend/coaching/content-product-laws.test.js backend/coaching/sanitizer.product-laws.test.js backend/coaching/exact-next-sequence.test.js backend/coaching/persisted-trial-integrity.test.js backend/coaching/fem-v1-runtime-turn.test.js
