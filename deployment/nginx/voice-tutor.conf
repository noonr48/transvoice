# SLOANE Voice Tutor standalone HTTPS/WSS reverse proxy.
#
# Replace voice.example.com, certificate paths, and /opt/sloane/voice-tutor/dist
# before use. The standalone gateway is expected on 127.0.0.1:3021.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name voice.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name voice.example.com;

    ssl_certificate /etc/letsencrypt/live/voice.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voice.example.com/privkey.pem;

    root /opt/sloane/voice-tutor/dist;
    index voice-tutor.html;

    client_max_body_size 25m;

    location ~ ^/(health$|voice/|voice-trainer/|knowledge/voice/|task/|session/|sessions/|models(?:/|$)|agents/|compatibility-presets$|deeptutor/voice/) {
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /voice-tutor-sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /voice-tutor.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /voice-tutor.html;
    }
}
